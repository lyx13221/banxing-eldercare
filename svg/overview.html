<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>伴行 · 双端 12 屏总览</title>
<style>
  :root{ --paper:#F6F2EA; --ink:#26241F; --muted:#8A857A; }
  *{box-sizing:border-box}
  body{margin:0;padding:28px 26px 60px;background:#1F1D21;color:#EDE7DA;
       font-family:"PingFang SC","Microsoft YaHei",sans-serif}
  h1{font-size:20px;margin:0 0 4px;letter-spacing:.02em}
  p.sub{margin:0 0 22px;color:#A9A294;font-size:13px}
  h2{font-size:13px;letter-spacing:.16em;color:#C6BEAF;margin:26px 0 12px;font-weight:700}
  .grid{display:flex;flex-wrap:wrap;gap:18px}
  .item{background:#2A272D;border-radius:16px;padding:10px;border:1px solid #3A3640}
  .item img{display:block;width:250px;border-radius:10px;background:var(--paper)}
  .cap{font-size:11px;color:#B8B1A2;margin-top:7px;text-align:center;letter-spacing:.04em}
</style>
</head>
<body>
<h1>伴行 · 适老化双端 — 12 屏 SVG</h1>
<p class="sub">每个 SVG 都是 390×844，文字是真实文本节点（Figma 里可直接改字、改色、改图层）。</p>

<h2>老人端（王奶奶 78 岁）</h2>
<div class="grid">
  <div class="item"><img src="01-elder-today.svg" alt=""><div class="cap">01 今天</div></div>
  <div class="item"><img src="02-elder-walker.svg" alt=""><div class="cap">02 助行器</div></div>
  <div class="item"><img src="03-elder-go.svg" alt=""><div class="cap">03 出行</div></div>
  <div class="item"><img src="04-elder-nav.svg" alt=""><div class="cap">04 导航</div></div>
  <div class="item"><img src="05-elder-meds.svg" alt=""><div class="cap">05 吃药</div></div>
  <div class="item"><img src="06-elder-family.svg" alt=""><div class="cap">06 家人</div></div>
</div>

<h2>看护端（女儿 小雷）</h2>
<div class="grid">
  <div class="item"><img src="07-carer-home.svg" alt=""><div class="cap">07 首页</div></div>
  <div class="item"><img src="08-carer-live.svg" alt=""><div class="cap">08 实时</div></div>
  <div class="item"><img src="09-carer-modules.svg" alt=""><div class="cap">09 模块</div></div>
  <div class="item"><img src="10-carer-meds.svg" alt=""><div class="cap">10 用药护理</div></div>
  <div class="item"><img src="11-carer-plan.svg" alt=""><div class="cap">11 提醒日程</div></div>
  <div class="item"><img src="12-carer-report.svg" alt=""><div class="cap">12 周报</div></div>
</div>
</body>
</html>
